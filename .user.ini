[config]
; Azure App Service PHP Configuration

; Error handling - hide errors in production
display_errors = Off
log_errors = On
error_log = D:\home\LogFiles\php_errors.log

; Timezone
date.timezone = Asia/Jakarta

; Upload limits
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
max_input_time = 60

; Memory
memory_limit = 256M

; Session
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On

; Extensions (Azure sudah include by default)
extension=mysqli
extension=curl
extension=mbstring
extension=openssl
